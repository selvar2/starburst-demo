<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Analytics AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a28;--surface3:#222236;--accent1:#a855f7;--accent2:#3b82f6;--accent3:#06b6d4;--text:#e4e4e7;--muted:#71717a;--border:#2a2a3d;--glow:rgba(168,85,247,.15)}
[data-theme="light"]{--bg:#f8f9fc;--surface:#ffffff;--surface2:#f0f1f5;--surface3:#e8e9f0;--accent1:#9333ea;--accent2:#2563eb;--accent3:#0891b2;--text:#18181b;--muted:#71717a;--border:#e2e2e8;--glow:rgba(147,51,234,.08)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--muted)}

.gradient-text{background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.gradient-bg{background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3))}
.gradient-border{position:relative}
.gradient-border::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,var(--accent1),var(--accent2),var(--accent3));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass{background:rgba(18,18,26,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--border)}
[data-theme="light"] .glass{background:rgba(255,255,255,.75)}
.btn-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:none;background:var(--surface2);color:var(--text);cursor:pointer;transition:all .2s}
.btn-icon:hover{background:var(--surface3);transform:translateY(-1px)}
.btn-icon.active{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff}
.btn-gradient{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;border:none;padding:8px 20px;border-radius:10px;font-weight:600;cursor:pointer;transition:all .2s;font-size:.875rem}
.btn-gradient:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 4px 20px rgba(168,85,247,.3)}

/* Layout */
.app{display:flex;height:100vh;position:relative}
.sidebar-left{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s,width .3s;flex-shrink:0;overflow:hidden;z-index:20}
.sidebar-left.collapsed{transform:translateX(-280px);width:0;border:none}
.main-panel{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.sidebar-right{width:320px;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;transition:transform .3s,width .3s;flex-shrink:0;overflow:hidden;z-index:20}
.sidebar-right.collapsed{transform:translateX(320px);width:0;border:none}

/* Sidebar */
.logo-area{padding:20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent1),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.schema-browser{flex:1;overflow-y:auto;padding:12px}
.schema-section-title{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px 8px 4px}
.tree-item{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.825rem;transition:background .15s;color:var(--text)}
.tree-item:hover{background:var(--surface2)}
.tree-item .icon{font-size:.75rem;color:var(--muted);width:16px;text-align:center;flex-shrink:0}
.tree-item.catalog .icon{color:var(--accent1)}
.tree-item.schema-node .icon{color:var(--accent2)}
.tree-item.table .icon{color:var(--accent3)}
.tree-item.table .tree-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-expander{border:none;background:transparent;color:inherit;width:16px;padding:0;cursor:pointer;font-size:.75rem;line-height:1;text-align:center;flex-shrink:0}
.tree-menu-btn{margin-left:auto;border:none;background:transparent;color:var(--muted);width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-weight:700;opacity:.75;flex-shrink:0}
.tree-menu-btn:hover{background:var(--surface3);color:var(--text);opacity:1}
.tree-item.column{padding:5px 8px 5px 12px;margin:1px 0 1px 4px;color:var(--text-muted);font-size:.78rem;border-left:1px solid rgba(148,163,184,.22);gap:7px}
.tree-item.column:hover{background:rgba(59,130,246,.08);color:var(--text)}
.tree-item.column .icon{width:12px;color:var(--accent1);font-size:.72rem}
.column-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.column-type{margin-left:auto;color:var(--muted);font-size:.72rem;font-style:italic;max-width:86px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-children{padding-left:16px;overflow:hidden;transition:max-height .3s;max-height:0}
.tree-children.open{max-height:10000px}
.schema-context-menu{position:fixed;z-index:200;min-width:270px;max-width:360px;border:1px solid var(--border);border-radius:8px;background:var(--surface);box-shadow:0 18px 45px rgba(0,0,0,.35);padding:6px}
.schema-menu-item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;border:none;background:transparent;color:var(--text);font:inherit;font-size:.78rem;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer}
.schema-menu-item:hover{background:var(--surface2)}
.schema-menu-main{display:flex;flex-direction:column;gap:3px;min-width:0}
.schema-menu-label{font-weight:650;line-height:1.2}
.schema-menu-preview{font-family:'Fira Code',monospace;font-size:.66rem;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.schema-menu-sql{font-family:'Fira Code',monospace;font-size:.68rem;color:var(--accent1);white-space:nowrap}
.schema-menu-divider{height:1px;background:var(--border);margin:5px 4px}
.sidebar-bottom{padding:16px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.theme-toggle{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.8rem;color:var(--muted)}
.toggle-track{width:44px;height:24px;border-radius:12px;background:var(--surface3);position:relative;transition:background .2s}
.toggle-thumb{width:18px;height:18px;border-radius:50%;background:var(--text);position:absolute;top:3px;left:3px;transition:transform .2s}
[data-theme="light"] .toggle-thumb{transform:translateX(20px)}

/* Chat area */
.chat-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--surface)}
.chat-messages{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}
.chat-input-area{padding:16px 20px;border-top:1px solid var(--border);background:var(--surface)}
.input-wrapper{display:flex;gap:10px;align-items:flex-end}
.input-wrapper textarea{flex:1;resize:none;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-family:inherit;font-size:.9rem;line-height:1.5;min-height:46px;max-height:150px;transition:border-color .2s;outline:none}
.input-wrapper textarea::placeholder{color:#9ca3af}
.input-wrapper textarea:focus{border-color:var(--accent2)}
.send-btn{width:46px;height:46px;border-radius:12px;border:none;background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0}
.send-btn:hover{transform:scale(1.05);box-shadow:0 4px 20px rgba(168,85,247,.4)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* Messages */
.msg{display:flex;gap:12px;animation:msgIn .4s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;font-weight:600}
.msg.user .msg-avatar{background:linear-gradient(135deg,var(--accent1),var(--accent2));color:#fff}
.msg.bot .msg-avatar{background:var(--surface3);color:var(--accent3)}
.msg-bubble{max-width:75%;border-radius:16px;overflow:hidden}
.msg.user .msg-bubble{background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(59,130,246,.2));border:1px solid rgba(168,85,247,.2);padding:12px 16px;border-top-right-radius:4px}
.msg.bot .msg-bubble{background:var(--surface2);border:1px solid var(--border);border-top-left-radius:4px;max-width:85%}
.msg.bot .msg-bubble.chart-result{cursor:pointer;transition:border-color .2s,box-shadow .2s,background .2s}
.msg.bot .msg-bubble.chart-result:hover{border-color:rgba(59,130,246,.45)}
.msg.bot .msg-bubble.chart-result.active-result{border-color:var(--accent2);box-shadow:0 0 0 1px rgba(59,130,246,.35),0 10px 28px rgba(59,130,246,.08);background:linear-gradient(180deg,var(--surface2),rgba(59,130,246,.05))}
.msg-text{font-size:.9rem;line-height:1.6}
.confirm-panel{margin:12px 14px 0;padding:14px;border:1px solid rgba(239,68,68,.38);border-radius:10px;background:rgba(127,29,29,.18);display:flex;flex-direction:column;gap:12px}
.confirm-title{font-size:.8rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fca5a5}
.confirm-copy{font-size:.86rem;line-height:1.5;color:var(--text)}
.confirm-actions{display:flex;flex-wrap:wrap;gap:10px}
.confirm-btn{border:1px solid rgba(239,68,68,.45);border-radius:9px;padding:9px 13px;font-size:.8rem;font-weight:750;cursor:pointer;color:#fff;background:linear-gradient(135deg,#ef4444,#b91c1c);transition:transform .15s,opacity .15s}
.confirm-btn:hover{transform:translateY(-1px)}
.confirm-btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.cancel-btn{border:1px solid var(--border);border-radius:9px;padding:9px 13px;font-size:.8rem;font-weight:700;cursor:pointer;color:var(--text);background:var(--surface3)}
.cancel-btn:hover{border-color:var(--muted)}

/* SQL block */
.sql-block{border-bottom:1px solid var(--border)}
.sql-header{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:rgba(0,0,0,.15)}
.sql-header:hover{color:var(--text)}
.sql-body{max-height:0;overflow:hidden;transition:max-height .3s}
.sql-body.open{max-height:400px}
.sql-body pre{padding:14px;font-family:'Fira Code',monospace;font-size:.8rem;line-height:1.6;overflow-x:auto;white-space:pre-wrap;color:var(--text)}
.sql-kw{color:var(--accent1);font-weight:600}
.sql-str{color:#22c55e}
.sql-num{color:var(--accent3)}
.sql-fn{color:var(--accent2)}

/* Data table */
.data-section{padding:14px}
.row-badge{display:inline-flex;align-items:center;gap:4px;font-size:.7rem;font-weight:600;padding:3px 10px;border-radius:20px;background:rgba(168,85,247,.15);color:var(--accent1);margin-bottom:10px}
.data-table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border)}
.data-table{width:100%;border-collapse:collapse;font-size:.8rem}
.data-table th{padding:8px 12px;text-align:left;font-weight:600;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface3);white-space:nowrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2}
[data-theme="light"] .data-table th{background:var(--surface3)}
.data-table td{padding:7px 12px;border-bottom:1px solid var(--border);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.data-table td.long-sql-cell{white-space:normal;max-width:none;overflow:visible;text-overflow:clip;vertical-align:top}
.sql-value{display:block;width:100%;max-width:100%;max-height:360px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:'Fira Code',Consolas,monospace;font-size:.78rem;line-height:1.55;color:var(--text);background:rgba(0,0,0,.18);border:1px solid var(--border);border-radius:8px;padding:12px}
.data-table tbody tr:nth-child(even){background:rgba(0,0,0,.06)}
.data-table tbody tr:hover{background:rgba(168,85,247,.06)}
.show-more-btn{display:block;width:100%;padding:8px;text-align:center;font-size:.8rem;color:var(--accent2);cursor:pointer;border:none;background:none;font-weight:500}
.show-more-btn:hover{text-decoration:underline}

/* Export bar */
.export-bar{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--border)}
.ai-insights{margin:10px 14px 0;padding:16px;border:1px solid rgba(168,85,247,.22);border-radius:8px;background:rgba(168,85,247,.06);display:flex;flex-direction:column;gap:12px}
.ai-summary{font-size:.9rem;line-height:1.55;color:var(--text);font-weight:500;max-width:80ch}
.ai-meta{display:flex;flex-wrap:wrap;gap:7px;margin:0;align-items:center}
.ai-pill{display:inline-flex;align-items:center;min-height:24px;font-size:.72rem;line-height:1;font-weight:650;color:var(--text);border:1px solid rgba(148,163,184,.22);border-radius:999px;padding:5px 10px;background:rgba(10,10,15,.72);white-space:nowrap}
.ai-list{list-style:none;margin:0;padding:0;color:var(--text);font-size:.86rem;line-height:1.5;display:flex;flex-direction:column;gap:6px}
.ai-list li{position:relative;padding-left:20px;max-width:86ch}
.ai-list li::before{content:'';position:absolute;left:4px;top:.68em;width:5px;height:5px;border-radius:50%;background:var(--accent2);opacity:.85}
.dashboard-hints{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:0}
.dashboard-card{border:1px solid var(--border);border-radius:8px;padding:12px;background:rgba(10,10,15,.72);min-height:72px;display:flex;flex-direction:column;justify-content:center}
.dashboard-card-title{font-size:.82rem;line-height:1.35;color:var(--text);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dashboard-card-sub{font-size:.73rem;line-height:1.35;color:var(--muted);margin-top:6px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:0}
.kpi-card{border:1px solid rgba(168,85,247,.32);border-radius:8px;padding:14px 15px;background:linear-gradient(135deg,rgba(168,85,247,.12),rgba(34,197,94,.08));min-height:118px;display:flex;flex-direction:column;justify-content:center}
.kpi-label{font-size:.72rem;line-height:1.25;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.055em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-value{font-size:1.12rem;line-height:1.2;color:var(--text);font-weight:800;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-sub{font-size:.78rem;line-height:1.35;color:var(--text);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart-narration{margin:0;padding:12px 14px;border-left:3px solid var(--accent1);background:rgba(0,0,0,.14);border-radius:7px;color:var(--text);font-size:.86rem;line-height:1.5;max-width:86ch}
@media(max-width:700px){.ai-insights{padding:14px}.kpi-grid,.dashboard-hints{grid-template-columns:1fr}.ai-pill{white-space:normal}.kpi-card{min-height:104px}}
.suggestions-row{display:flex;flex-wrap:wrap;gap:10px;padding:14px 0 6px 52px;animation:fadeUp .3s ease}
.suggestion-chip{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:24px;border:1px solid rgba(168,85,247,.5);background:linear-gradient(135deg,rgba(168,85,247,.18),rgba(59,130,246,.14));color:#f8fafc;font-size:.86rem;font-weight:750;letter-spacing:.01em;cursor:pointer;transition:all .25s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 0 0 1px rgba(255,255,255,.04)}
.suggestion-chip:hover,.suggestion-chip:focus-visible{border-color:rgba(6,182,212,.9);color:#fff;background:linear-gradient(135deg,rgba(168,85,247,.32),rgba(59,130,246,.28));transform:translateY(-2px);box-shadow:0 8px 22px rgba(59,130,246,.28),0 0 0 2px rgba(6,182,212,.22);outline:none}
[data-theme="light"] .suggestion-chip{border-color:rgba(147,51,234,.42);background:linear-gradient(135deg,rgba(147,51,234,.13),rgba(37,99,235,.1));color:#111827;box-shadow:0 8px 20px rgba(37,99,235,.12),inset 0 0 0 1px rgba(255,255,255,.85)}
[data-theme="light"] .suggestion-chip:hover,[data-theme="light"] .suggestion-chip:focus-visible{border-color:rgba(37,99,235,.72);color:#0f172a;background:linear-gradient(135deg,rgba(147,51,234,.2),rgba(37,99,235,.17));box-shadow:0 9px 22px rgba(37,99,235,.2),0 0 0 2px rgba(147,51,234,.16)}
.chip-icon{font-size:1rem;line-height:1}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

/* Chart */
.chart-area{padding:14px}
.chart-area canvas{border-radius:10px;max-height:300px}

/* Right panel */
.panel-title{padding:16px 20px;font-weight:700;font-size:.95rem;border-bottom:1px solid var(--border)}
.panel-body{padding:16px 20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;flex:1}
.field-label{font-size:.75rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.chart-type-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.chart-type-btn{padding:10px 0;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;text-align:center;font-size:.7rem;font-weight:500;transition:all .2s}
.chart-type-btn:hover{border-color:var(--accent2);color:var(--text)}
.chart-type-btn.active{background:linear-gradient(135deg,rgba(168,85,247,.2),rgba(59,130,246,.2));border-color:var(--accent1);color:var(--text)}
.field-select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.85rem;font-family:inherit;outline:none}
.field-select:focus{border-color:var(--accent2)}
.color-swatches{display:flex;gap:8px}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .2s}
.color-swatch:hover,.color-swatch.active{border-color:var(--text);transform:scale(1.15)}

/* Welcome screen */
.welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:40px;gap:20px;animation:fadeIn .6s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.welcome h2{font-size:2rem;font-weight:800}
.welcome p{color:var(--muted);font-size:1rem;max-width:400px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.chip{padding:8px 18px;border-radius:20px;font-size:.85rem;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text);transition:all .2s;white-space:nowrap}
.chip:hover{border-color:var(--accent2);background:rgba(59,130,246,.1);transform:translateY(-2px)}

/* Typing indicator */
.typing{display:flex;gap:5px;padding:12px 16px;align-items:center}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}}

/* Toast */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:10px;font-size:.85rem;font-weight:500;animation:toastIn .3s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.toast.success{background:linear-gradient(135deg,#059669,#10b981);color:#fff}
.toast.error{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff}
@keyframes toastIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* History */
.history-list{padding:8px}
.history-item{padding:8px 10px;border-radius:8px;font-size:.8rem;color:#a1a1aa;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.history-item:hover{background:var(--surface2);color:var(--text)}

/* Responsive */
@media(max-width:900px){.sidebar-left,.sidebar-right{position:fixed;top:0;height:100vh;z-index:50}.sidebar-left{left:0}.sidebar-right{right:0}.sidebar-left.collapsed{transform:translateX(-280px)}.sidebar-right.collapsed{transform:translateX(320px)}}
@media(max-width:600px){.msg-bubble{max-width:92%!important}}

/* Mobile overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.overlay.show{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- Left Sidebar -->
  <aside class="sidebar-left" id="sidebarLeft">
    <div class="logo-area">
      <div class="logo-icon">
        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </div>
      <div>
        <div class="gradient-text" style="font-weight:800;font-size:1.1rem">Data Analytics AI</div>
        <div style="font-size:.65rem;color:var(--muted)">Intelligent Data Explorer</div>
      </div>
    </div>
    <div class="schema-section-title" style="padding-top:16px;display:flex;align-items:center;justify-content:space-between">Schema Browser<button onclick="fetchSchema(true)" title="Refresh schema" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:2px 6px;border-radius:4px;transition:all .2s" onmouseover="this.style.color='var(--purple)';this.style.background='rgba(168,85,247,.1)'" onmouseout="this.style.color='var(--muted)';this.style.background='none'" id="schemaRefreshBtn">&#8635;</button></div>
    <div class="schema-browser" id="schemaBrowser">
      <div style="padding:20px;text-align:center;color:var(--muted);font-size:.8rem">Loading schema...</div>
    </div>
    <div class="schema-section-title">History</div>
    <div class="history-list" id="historyList" style="flex:0 0 auto;max-height:160px;overflow-y:auto"></div>
    <div class="sidebar-bottom">
      <label class="theme-toggle" onclick="toggleTheme()">
        <span id="themeLabel">Dark</span>
        <div class="toggle-track"><div class="toggle-thumb"></div></div>
      </label>
      <span style="font-size:.65rem;color:var(--muted)">v2.0</span>
    </div>
  </aside>

  <!-- Overlay for mobile -->
  <div class="overlay" id="overlay" onclick="closeSidebars()"></div>

  <!-- Main Panel -->
  <main class="main-panel">
    <div class="chat-header">
      <button class="btn-icon" onclick="toggleSidebar('left')" title="Toggle sidebar">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div style="flex:1;font-weight:600;font-size:.95rem">Chat</div>
      <button class="btn-icon" onclick="toggleSidebar('right')" title="Chart settings" id="chartPanelBtn">
        <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-8 4 4 4-6"/></svg>
      </button>
    </div>
    <div class="chat-messages" id="chatMessages">
      <!-- Welcome screen inserted by JS -->
    </div>
    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="chatInput" rows="1" placeholder="Ask about your data..." onkeydown="handleInputKey(event)" oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
  </main>

  <!-- Right Sidebar -->
  <aside class="sidebar-right collapsed" id="sidebarRight">
    <div class="panel-title gradient-text">Chart Configuration</div>
    <div class="panel-body">
      <div>
        <div class="field-label">Chart Type</div>
        <div class="chart-type-grid">
          <button class="chart-type-btn active" data-type="bar" onclick="selectChartType('bar',this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg><br>Bar
          </button>
          <button class="chart-type-btn" data-type="pie" onclick="selectChartType('pie',this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2v10l8.5 5"/></svg><br>Pie
          </button>
          <button class="chart-type-btn" data-type="line" onclick="selectChartType('line',this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l5-12 5 6 5-10 3 4"/></svg><br>Line
          </button>
          <button class="chart-type-btn" data-type="area" onclick="selectChartType('area',this)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20l5-12 5 6 5-10 3 4v12H3z" fill="currentColor" opacity=".15"/><path d="M3 20l5-12 5 6 5-10 3 4"/></svg><br>Area
          </button>
        </div>
      </div>
      <div>
        <div class="field-label">X-Axis Column</div>
        <select class="field-select" id="xAxisSelect" onchange="updateChartConfigFromPanel()"><option value="">-- Select --</option></select>
      </div>
      <div>
        <div class="field-label">Y-Axis Column</div>
        <select class="field-select" id="yAxisSelect" onchange="updateChartConfigFromPanel()"><option value="">-- Select --</option></select>
      </div>
      <div>
        <div class="field-label">Color Theme</div>
        <div class="color-swatches">
          <div class="color-swatch active" style="background:linear-gradient(135deg,#a855f7,#3b82f6)" data-theme="purple" onclick="selectColorTheme('purple',this)"></div>
          <div class="color-swatch" style="background:linear-gradient(135deg,#06b6d4,#22c55e)" data-theme="teal" onclick="selectColorTheme('teal',this)"></div>
          <div class="color-swatch" style="background:linear-gradient(135deg,#f59e0b,#ef4444)" data-theme="warm" onclick="selectColorTheme('warm',this)"></div>
          <div class="color-swatch" style="background:linear-gradient(135deg,#ec4899,#a855f7)" data-theme="pink" onclick="selectColorTheme('pink',this)"></div>
          <div class="color-swatch" style="background:linear-gradient(135deg,#64748b,#94a3b8)" data-theme="slate" onclick="selectColorTheme('slate',this)"></div>
        </div>
      </div>
      <button class="btn-gradient" style="width:100%;margin-top:8px" onclick="generateChartFromPanel()">Generate Chart</button>
    </div>
  </aside>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const API='';
const state={messages:[],currentData:null,currentMsgId:null,selectedMsgId:null,schema:null,theme:'dark',chartType:'bar',colorTheme:'purple',chartConfig:{xAxis:null,yAxis:null,chartType:'bar'},results:{},chartConfigs:{},charts:{}};
const colorThemes={
  purple:['rgba(168,85,247,.8)','rgba(59,130,246,.8)','rgba(6,182,212,.8)','rgba(34,197,94,.8)','rgba(245,158,11,.8)','rgba(236,72,153,.8)'],
  teal:['rgba(6,182,212,.8)','rgba(34,197,94,.8)','rgba(16,185,129,.8)','rgba(20,184,166,.8)','rgba(56,189,248,.8)','rgba(74,222,128,.8)'],
  warm:['rgba(245,158,11,.8)','rgba(239,68,68,.8)','rgba(249,115,22,.8)','rgba(234,179,8,.8)','rgba(220,38,38,.8)','rgba(251,146,60,.8)'],
  pink:['rgba(236,72,153,.8)','rgba(168,85,247,.8)','rgba(244,114,182,.8)','rgba(192,132,252,.8)','rgba(249,168,212,.8)','rgba(196,181,253,.8)'],
  slate:['rgba(100,116,139,.8)','rgba(148,163,184,.8)','rgba(71,85,105,.8)','rgba(203,213,225,.8)','rgba(51,65,85,.8)','rgba(226,232,240,.8)']
};

// Init
document.addEventListener('DOMContentLoaded',()=>{renderWelcome();fetchSchema()});

function fetchSchema(force){
  const btn=document.getElementById('schemaRefreshBtn');
  if(force){
    document.getElementById('schemaBrowser').innerHTML='<div style="padding:20px;text-align:center;color:var(--muted);font-size:.8rem">Refreshing schema...</div>';
    if(btn){btn.style.animation='spin .6s linear infinite'}
  }
  const url=API+'/api/schema'+(force?'?refresh=1':'');
  fetch(url).then(r=>r.json()).then(d=>{
    state.schema=d;
    renderSchema(d);
    if(btn){btn.style.animation=''}
  }).catch(()=>{
    document.getElementById('schemaBrowser').innerHTML='<div style="padding:16px;color:var(--muted);font-size:.8rem">Could not load schema. Is the server running?</div>';
    if(btn){btn.style.animation=''}
  });
}

function renderSchema(data){
  const el=document.getElementById('schemaBrowser');
  if(!data||!data.schemas||!data.schemas.length){el.innerHTML='<div style="padding:16px;color:var(--muted);font-size:.8rem">No schemas found.</div>';return}
  let h='';
  const catalog=data.catalog||'mcp2ohio';
  h+=`<div class="tree-item catalog" onclick="toggleTree(this)"><span class="icon">&#9671;</span><strong>${esc(catalog)}</strong></div><div class="tree-children open">`;
  data.schemas.forEach(s=>{
    h+=`<div class="tree-item schema-node" onclick="toggleTree(this)"><span class="icon">&#9655;</span>${esc(s.name)}</div><div class="tree-children">`;
    (s.tables||[]).forEach(t=>{
      const tn=typeof t==='string'?t:t.name;
      const columns=Array.isArray(t.columns)?t.columns:[];
      h+=`<div class="tree-item table" oncontextmenu='openTableMenu(event,${jsArg(catalog)},${jsArg(s.name)},${jsArg(tn)})' onclick='insertTableQuery(${jsArg(catalog)},${jsArg(s.name)},${jsArg(tn)})'><button class="tree-expander icon" title="Expand table" onclick="toggleTree(this.closest('.tree-item'),event)">&#9655;</button><span class="tree-label">${esc(tn)}</span><button class="tree-menu-btn" title="Table actions" onclick='openTableMenu(event,${jsArg(catalog)},${jsArg(s.name)},${jsArg(tn)})'>&#8942;</button></div><div class="tree-children">`;
      if(columns.length){
        columns.forEach(c=>{
          const cn=typeof c==='string'?c:c.name;
          const ct=typeof c==='string'?'unknown':(c.type||'unknown');
          h+=`<div class="tree-item column" title="${esc(cn)} (${esc(ct)})" onclick='insertColumnQuery(event,${jsArg(catalog)},${jsArg(s.name)},${jsArg(tn)},${jsArg(cn)})'><span class="icon">&#9632;</span><span class="column-name">${esc(cn)}</span><span class="column-type">${esc(ct)}</span></div>`;
        });
      }else{
        h+=`<div class="tree-item column" style="cursor:default"><span class="icon">&#9632;</span><span class="column-name">No columns loaded</span><span class="column-type">unknown</span></div>`;
      }
      h+=`</div>`;
    });
    h+=`</div>`;
  });
  h+=`</div>`;
  el.innerHTML=h;
}

function toggleTree(el,event){
  if(event){event.stopPropagation();event.preventDefault()}
  const children=el.nextElementSibling;
  if(children&&children.classList.contains('tree-children')){
    children.classList.toggle('open');
    const icon=el.querySelector('.icon');
    if(icon){icon.innerHTML=children.classList.contains('open')?'&#9661;':'&#9655;'}
  }
}

function insertTableQuery(catalog,schema,table){
  closeTableMenu();
  const input=document.getElementById('chatInput');
  input.value=`SELECT * FROM ${quoteIdent(catalog)}.${quoteIdent(schema)}.${quoteIdent(table)} LIMIT 100;`;
  input.focus();
  autoResize(input);
}

function insertColumnQuery(event,catalog,schema,table,column){
  if(event){event.stopPropagation()}
  closeTableMenu();
  const input=document.getElementById('chatInput');
  input.value=`SELECT ${quoteIdent(column)} FROM ${quoteIdent(catalog)}.${quoteIdent(schema)}.${quoteIdent(table)} LIMIT 100;`;
  input.focus();
  autoResize(input);
}

function insertEditorSQL(sql){
  closeTableMenu();
  const input=document.getElementById('chatInput');
  input.value=sql;
  input.focus();
  autoResize(input);
}

function tablePath(catalog,schema,table){
  return `${quoteIdent(catalog)}.${quoteIdent(schema)}.${quoteIdent(table)}`;
}

function openTableMenu(event,catalog,schema,table){
  if(event){event.preventDefault();event.stopPropagation()}
  closeTableMenu();
  const fullPath=tablePath(catalog,schema,table);
  const displayPath=`${catalog}.${schema}.${table}`;
  const selectSql=`SELECT * FROM ${fullPath} LIMIT 100;`;
  const describeSql=`DESCRIBE ${fullPath};`;
  const showCreateSql=`SHOW CREATE TABLE ${fullPath};`;
  const menu=document.createElement('div');
  menu.className='schema-context-menu';
  menu.id='schemaContextMenu';
  menu.style.left=Math.min(event.clientX,window.innerWidth-380)+'px';
  menu.style.top=Math.min(event.clientY,window.innerHeight-310)+'px';
  menu.innerHTML=`
    <button class="schema-menu-item" onclick='copyTablePath(${jsArg(fullPath)})'><span class="schema-menu-main"><span class="schema-menu-label">Copy full path</span><span class="schema-menu-preview">${esc(displayPath)}</span></span></button>
    <button class="schema-menu-item" onclick='insertEditorSQL(${jsArg(selectSql)})'><span class="schema-menu-main"><span class="schema-menu-label">Generate SQL for this data</span><span class="schema-menu-preview">${esc(selectSql)}</span></span></button>
    <div class="schema-menu-divider"></div>
    <button class="schema-menu-item" onclick='insertEditorSQL(${jsArg(selectSql)})'><span class="schema-menu-main"><span class="schema-menu-label">SELECT * query</span><span class="schema-menu-preview">${esc(selectSql)}</span></span><span class="schema-menu-sql">LIMIT 100</span></button>
    <button class="schema-menu-item" onclick='insertEditorSQL(${jsArg(describeSql)})'><span class="schema-menu-main"><span class="schema-menu-label">DESCRIBE query</span><span class="schema-menu-preview">${esc(describeSql)}</span></span></button>
    <button class="schema-menu-item" onclick='insertEditorSQL(${jsArg(showCreateSql)})'><span class="schema-menu-main"><span class="schema-menu-label">SHOW CREATE TABLE query</span><span class="schema-menu-preview">${esc(showCreateSql)}</span></span></button>
    <div class="schema-menu-divider"></div>
    <button class="schema-menu-item" onclick='insertTableQuery(${jsArg(catalog)},${jsArg(schema)},${jsArg(table)})'><span class="schema-menu-main"><span class="schema-menu-label">Go to table</span><span class="schema-menu-preview">${esc(selectSql)}</span></span></button>
  `;
  document.body.appendChild(menu);
}

function closeTableMenu(){
  const menu=document.getElementById('schemaContextMenu');
  if(menu){menu.remove()}
}

function copyTablePath(path){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(path).then(()=>showToast('Table path copied','success')).catch(()=>insertEditorSQL(path));
  }else{
    insertEditorSQL(path);
  }
  closeTableMenu();
}

document.addEventListener('click',e=>{
  if(!e.target.closest||!e.target.closest('#schemaContextMenu')){closeTableMenu()}
});

// Theme
function toggleTheme(){
  const t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',t);
  state.theme=t;
  document.getElementById('themeLabel').textContent=t==='dark'?'Dark':'Light';
}

// Sidebars
function toggleSidebar(side){
  if(side==='left'){document.getElementById('sidebarLeft').classList.toggle('collapsed')}
  else{document.getElementById('sidebarRight').classList.toggle('collapsed')}
  updateOverlay();
}
function closeSidebars(){
  document.getElementById('sidebarLeft').classList.add('collapsed');
  document.getElementById('sidebarRight').classList.add('collapsed');
  updateOverlay();
}
function updateOverlay(){
  const l=!document.getElementById('sidebarLeft').classList.contains('collapsed');
  const r=!document.getElementById('sidebarRight').classList.contains('collapsed');
  document.getElementById('overlay').classList.toggle('show',(l||r)&&window.innerWidth<=900);
}

// Welcome
function renderWelcome(){
  const el=document.getElementById('chatMessages');
  el.innerHTML=`<div class="welcome">
    <div class="logo-icon" style="width:64px;height:64px;border-radius:18px;font-size:28px">
      <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    </div>
    <h2 class="gradient-text">Welcome to Data Analytics AI</h2>
    <p>Ask questions about your data in natural language. I'll write SQL, fetch results, and visualize them for you.</p>
    <div class="chips">
      <div class="chip" onclick="sendChip(this)">Show all tables</div>
      <div class="chip" onclick="sendChip(this)">Describe demo table</div>
      <div class="chip" onclick="sendChip(this)">Show all data from demo</div>
      <div class="chip" onclick="sendChip(this)">Count rows in demo</div>
    </div>
  </div>`;
}

function sendChip(el){
  document.getElementById('chatInput').value=el.textContent;
  sendMessage();
}

// Input
function handleInputKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}
}
function autoResize(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,150)+'px';
}

// Send message
async function sendMessage(prefill,sqlOverride,extraContext){
  const input=document.getElementById('chatInput');
  const displayText=(prefill||input.value).trim();
  const queryText=sqlOverride||displayText;
  if(!displayText)return;
  if(window.innerWidth<=900)closeSidebars();
  input.value='';input.style.height='auto';

  // Clear welcome
  if(state.messages.length===0){document.getElementById('chatMessages').innerHTML=''}

  const msgId='msg_'+Date.now();
  state.messages.push({role:'user',text:displayText});
  addHistory(displayText);
  appendUserMsg(displayText);
  appendTyping();
  scrollChat();
  document.getElementById('sendBtn').disabled=true;

  try{
    const res=await fetch(API+'/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:queryText,context:{catalog:'mcp2ohio',schema:'test_writes',...(extraContext||{})}})
    });
    const data=await res.json();
    removeTyping();
    if(!res.ok||data.detail){
      const errMsg=data.detail||data.message||'Query failed. Please try again.';
      appendErrorMsg(errMsg);
    }else{
      state.messages.push({role:'bot',data,id:msgId});
      state.currentData=data;
      state.currentMsgId=msgId;
      state.results[msgId]=data;
      appendBotMsg(data,msgId);
      selectChartResult(msgId);
    }
  }catch(e){
    removeTyping();
    appendErrorMsg('Failed to connect to the server. Make sure the backend is running at '+API);
  }
  document.getElementById('sendBtn').disabled=false;
  scrollChat();
}

function appendUserMsg(text){
  const el=document.getElementById('chatMessages');
  el.insertAdjacentHTML('beforeend',`<div class="msg user"><div class="msg-avatar">You</div><div class="msg-bubble"><div class="msg-text">${esc(text)}</div></div></div>`);
}

function appendTyping(){
  const el=document.getElementById('chatMessages');
  el.insertAdjacentHTML('beforeend',`<div class="msg bot" id="typingMsg"><div class="msg-avatar">AI</div><div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`);
  scrollChat();
}
function removeTyping(){const e=document.getElementById('typingMsg');if(e)e.remove()}

function appendErrorMsg(text){
  const el=document.getElementById('chatMessages');
  el.insertAdjacentHTML('beforeend',`<div class="msg bot"><div class="msg-avatar">AI</div><div class="msg-bubble" style="border-color:rgba(239,68,68,.3)"><div class="msg-text" style="color:#f87171">${esc(text)}</div></div></div>`);
}

async function confirmOperation(msgId){
  const msg=state.messages.find(m=>m.id===msgId);
  if(!msg||!msg.data||!msg.data.sql)return;
  if(window.innerWidth<=900)closeSidebars();
  const btn=document.getElementById(msgId+'_confirmBtn');
  const cancel=document.getElementById(msgId+'_cancelBtn');
  if(btn){btn.disabled=true;btn.textContent='Running...'}
  if(cancel)cancel.disabled=true;
  appendUserMsg('Confirm '+(msg.data.operation||'operation'));
  appendTyping();
  document.getElementById('sendBtn').disabled=true;
  try{
    const res=await fetch(API+'/api/chat',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg.data.sql,context:{catalog:'mcp2ohio',schema:'test_writes',confirm:true}})
    });
    const data=await res.json();
    removeTyping();
    if(!res.ok||data.detail){
      appendErrorMsg(data.detail||data.message||'Confirmed operation failed.');
    }else{
      const newMsgId='msg_'+Date.now();
      state.messages.push({role:'bot',data,id:newMsgId});
      state.currentData=data;
      state.currentMsgId=newMsgId;
      state.results[newMsgId]=data;
      appendBotMsg(data,newMsgId);
      if(data.columns&&data.rows&&data.rows.length>0)selectChartResult(newMsgId);
    }
  }catch(e){
    removeTyping();
    appendErrorMsg('Failed to confirm operation. Make sure the backend is running at '+API);
  }
  document.getElementById('sendBtn').disabled=false;
  scrollChat();
}

function cancelOperation(msgId){
  const panel=document.getElementById(msgId+'_confirmPanel');
  if(panel){
    panel.innerHTML='<div class="confirm-title">Operation cancelled</div><div class="confirm-copy">No destructive query was executed.</div>';
  }
}

function appendBotMsg(data,msgId){
  const el=document.getElementById('chatMessages');
  const isChartable=!!(data.columns&&data.rows&&data.rows.length>0);
  let html=`<div class="msg bot"><div class="msg-avatar">AI</div><div class="msg-bubble${isChartable?' chart-result':''}" id="${msgId}" data-result-id="${msgId}" ${isChartable?`onclick="selectChartResult('${msgId}')"`:''}>`;

  // Message text
  if(data.message){html+=`<div class="data-section" style="padding-bottom:0"><div class="msg-text">${esc(data.message)}</div></div>`}

  // SQL
  if(data.sql){
    html+=`<div class="sql-block"><div class="sql-header" onclick="this.nextElementSibling.classList.toggle('open')">
      <span>SQL Query</span><span style="font-size:1rem">&#9662;</span></div>
      <div class="sql-body"><pre>${highlightSQL(data.sql)}</pre></div></div>`;
  }
  if(data.verification_sql){
    html+=`<div class="sql-block"><div class="sql-header" onclick="this.nextElementSibling.classList.toggle('open')">
      <span>Verification Query</span><span style="font-size:1rem">&#9662;</span></div>
      <div class="sql-body"><pre>${highlightSQL(data.verification_sql)}</pre></div></div>`;
  }

  if(data.requires_confirm){
    const op=esc(data.operation||'operation');
    const target=data.target?[data.target.catalog,data.target.schema,data.target.table].filter(Boolean).join('.'):'the selected object';
    html+=`<div class="confirm-panel" id="${msgId}_confirmPanel">
      <div class="confirm-title">Confirmation required</div>
      <div class="confirm-copy">This ${op} will modify data in <strong>${esc(target)}</strong>. Review the SQL above, then confirm only if you intend to run it.</div>
      <div class="confirm-actions">
        <button class="confirm-btn" id="${msgId}_confirmBtn" onclick="confirmOperation('${msgId}')">Confirm and run</button>
        <button class="cancel-btn" id="${msgId}_cancelBtn" onclick="cancelOperation('${msgId}')">Cancel</button>
      </div>
    </div>`;
  }

  html+=renderAIInsights(data);

  // Table
  if(data.columns&&data.rows&&data.rows.length){
    html+=`<div class="data-section" id="${msgId}_data">`;
    html+=`<span class="row-badge">${data.row_count||data.rows.length} rows</span>`;
    html+=renderTable(data.columns,data.rows,msgId);
    html+=`</div>`;
    // Export bar
    html+=`<div class="export-bar">`;
    html+=exportBtn('CSV','csv',msgId);
    html+=exportBtn('Excel','xlsx',msgId);
    html+=exportBtn('HTML','html',msgId);
    html+=exportBtn('PDF','pdf',msgId);
    html+=exportBtn('JPEG','jpeg',msgId);
    html+=`</div>`;
  }

  // Chart placeholder
  if(data.columns&&data.rows&&data.rows.length>0){
    html+=`<div class="chart-area" id="${msgId}_chartArea"><canvas id="${msgId}_chart"></canvas></div>`;
  }

  html+=`</div></div>`;

  // Smart follow-up suggestions
  const suggestions=getSuggestions(data);
  if(suggestions.length){
    html+=`<div class="suggestions-row">`;
    suggestions.forEach(s=>{
      const lbl=s.label||s;
      const q=(s.sql||s).replace(/'/g,"\\'");
      const display=lbl.replace(/'/g,"\\'");
      html+=`<button class="suggestion-chip" onclick="sendMessage('${display}','${q}')"><span class="chip-icon">${getChipIcon(lbl)}</span>${esc(lbl)}</button>`;
    });
    html+=`</div>`;
  }

  el.insertAdjacentHTML('beforeend',html);

  // Render chart (skip for metric/table — no chart needed)
  if(data.columns&&data.rows&&data.rows.length>0){
    const chartType=data.chart_suggestion||'bar';
    if(chartType!=='metric'&&chartType!=='table'){
      setTimeout(()=>renderChart(msgId,data.columns,data.rows,chartType),100);
    }
  }
}

function getFQTable(sql){
  // Extract catalog.schema.table from SQL
  const m=(sql||'').match(/(?:FROM|DESCRIBE|TABLE)\s+(\w+\.\w+\.\w+)/i);
  return m?m[1]:null;
}

  const recs=Array.isArray(data.recommendations)?data.recommendations:[];
  if(!hasSummary&&!insights.length&&!assumptions.length&&!cards.length&&!kpis.length&&!trends.length&&!recs.length&&!data.chart_explanation)return '';

  if(pills.length){

    pills.forEach(p=>{html+=`<span class="ai-pill">${esc(p)}</span>`});

  }
  if(kpis.length){
    html+='<div class="kpi-grid">';
    kpis.slice(0,4).forEach(k=>{
      html+=`<div class="kpi-card"><div class="kpi-label">${esc(k.label||'KPI')}</div><div class="kpi-value">${esc(String(k.value||''))}</div><div class="kpi-sub">${esc(k.subtitle||'')}</div></div>`;
    });
    html+='</div>';
  }
  if(insights.length){
    html+='<ul class="ai-list">';
    insights.slice(0,4).forEach(i=>{html+=`<li>${esc(i)}</li>`});
    html+='</ul>';
  }
  if(trends.length){
    html+='<ul class="ai-list">';
    trends.slice(0,3).forEach(i=>{html+=`<li>${esc(i)}</li>`});
    html+='</ul>';
  }
  if(data.chart_explanation){
    html+=`<div class="chart-narration">${esc(data.chart_explanation)}</div>`;
  }
  if(recs.length){
    html+='<ul class="ai-list">';
    recs.slice(0,3).forEach(i=>{html+=`<li>${esc(i)}</li>`});

  }
  if(assumptions.length){

function getChipIcon(label){
  const l=label.toLowerCase();
  if(l.startsWith('show all table')||l.startsWith('show tables')||l.startsWith('list')) return '📋';
  if(l.startsWith('describe')) return '🔍';
  if(l.startsWith('count')) return '🔢';
  if(l.startsWith('sum')||l.startsWith('average')||l.startsWith('group by')) return '📊';
  if(l.startsWith('show all data')||l.startsWith('show data')||l.startsWith('show me')) return '📄';
  return '💡';
}

function fqLocation(fq){
  // Returns "catalog.schema" from "catalog.schema.table"
  const parts=fq.split('.');
  return parts.length>=3?parts.slice(0,2).join('.'):fq;
}

function cleanMetricName(col){
  return String(col||'').replace(/^(total|sum|avg|average|min|max|count)_/i,'').replace(/_total$/i,'');
}

function isNumericValue(v){
  return typeof v==='number'||(typeof v==='string'&&v.trim()!==''&&!Number.isNaN(Number(v)));
}

function isLikelyDimension(col,value){
  const c=String(col||'').toLowerCase();
  return typeof value==='string'||c.includes('date')||c.includes('time')||c.includes('month')||c.includes('year')||c.includes('quarter')||c.includes('region')||c.includes('segment')||c.includes('category')||c.includes('status')||c.includes('channel')||c.includes('product')||c.includes('customer');
}

function isLikelyMeasure(col,value){
  const c=String(col||'').toLowerCase();
  if(c==='id'||c.endsWith('_id')||c.includes('year')||c.includes('quarter'))return false;
  return isNumericValue(value)||/(revenue|sales|profit|amount|value|cost|expense|units|count|accounts|customers|margin|rate|score|stock|pipeline|forecast|actual|target|growth)/.test(c);
}

function preferredSort(cols){
  const priority=['revenue','gross_profit','profit','sales','actual','forecast','pipeline','accounts','customers','units','value','amount','growth','rate','margin','score','stock'];
  return [...cols].sort((a,b)=>{
    const al=String(a).toLowerCase(); const bl=String(b).toLowerCase();
    const ap=priority.findIndex(p=>al.includes(p)); const bp=priority.findIndex(p=>bl.includes(p));
    return (ap<0?99:ap)-(bp<0?99:bp)||al.localeCompare(bl);
  });
}

function addUniqueSuggestion(suggestions,label,sql){
  if(!label||!sql)return;
  const key=label.toLowerCase();
  if(!suggestions.some(s=>String(s.label||s).toLowerCase()===key))suggestions.push({label,sql});
}

function chartableDemoSuggestions(){
  return [
    {label:'Revenue by region',sql:'SELECT region, SUM(revenue) AS total_revenue FROM mcp2ohio.test_writes.regional_sales GROUP BY region ORDER BY total_revenue DESC LIMIT 100'},
    {label:'Gross profit by region',sql:'SELECT region, SUM(gross_profit) AS total_gross_profit FROM mcp2ohio.test_writes.regional_sales GROUP BY region ORDER BY total_gross_profit DESC LIMIT 100'},
    {label:'Revenue trend by month',sql:'SELECT period_month, SUM(revenue) AS total_revenue FROM mcp2ohio.test_writes.monthly_sales GROUP BY period_month ORDER BY period_month LIMIT 100'},
    {label:'Revenue by product',sql:'SELECT product_name, SUM(revenue) AS total_revenue FROM mcp2ohio.test_writes.product_sales GROUP BY product_name ORDER BY total_revenue DESC LIMIT 100'},
    {label:'Revenue by customer segment',sql:'SELECT customer_segment, SUM(revenue) AS total_revenue FROM mcp2ohio.test_writes.customer_sales GROUP BY customer_segment ORDER BY total_revenue DESC LIMIT 100'},
    {label:'KPI actual vs target',sql:'SELECT kpi_name, actual_value, target_value FROM mcp2ohio.test_writes.kpi_metrics ORDER BY actual_value DESC LIMIT 100'}
  ];
}

function chartableSuggestionsFromResult(data,fq){
  if(!fq)return [];
  const cols=data.columns||[];
  const rows=data.rows||[];
  const sample=rows[0]||[];
  const dimensions=cols.filter((c,i)=>isLikelyDimension(c,sample[i])&&!isLikelyMeasure(c,sample[i])).slice(0,3);
  let measures=preferredSort(cols.filter((c,i)=>isLikelyMeasure(c,sample[i])).map(cleanMetricName));
  measures=[...new Set(measures)].slice(0,4);
  const suggestions=[];
  dimensions.forEach(dim=>{
    measures.forEach(metric=>{
      const alias=`total_${metric}`;
      addUniqueSuggestion(
        suggestions,
        `${metric.replace(/_/g,' ')} by ${dim.replace(/_/g,' ')}`,
        `SELECT ${dim}, SUM(${metric}) AS ${alias} FROM ${fq} GROUP BY ${dim} ORDER BY ${alias} DESC LIMIT 100`
      );
    });
  });
  return suggestions;
}

function getSuggestions(data){
  const sql=(data.sql||'');
  const sqlUp=sql.toUpperCase();
  const cols=data.columns||[];
  const rows=data.rows||[];
  const suggestions=[];
  if(Array.isArray(data.followups)){
    data.followups.slice(0,3).forEach(f=>addUniqueSuggestion(suggestions,f,f));
  }
  const fq=getFQTable(sql);
  chartableSuggestionsFromResult(data,fq).forEach(s=>addUniqueSuggestion(suggestions,s.label,s.sql));

  // After SHOW TABLES
  if(sqlUp.includes('SHOW TABLES')){
    const schemaMatch=sql.match(/FROM\s+(\w+\.\w+)/i);
    const prefix=schemaMatch?schemaMatch[1]:'mcp2ohio.test_writes';
    rows.forEach(r=>{
      const t=r[0];
      knownTableChartSuggestions(t,`${prefix}.${t}`).forEach(s=>addUniqueSuggestion(suggestions,s.label,s.sql));
    });
    return (suggestions.length?suggestions:chartableDemoSuggestions()).slice(0,8);
  }

  // After DESCRIBE
  if(sqlUp.includes('DESCRIBE')){
    if(fq){
      const tName=fq.split('.').pop();
      knownTableChartSuggestions(tName,fq).forEach(s=>addUniqueSuggestion(suggestions,s.label,s.sql));
      const numCols=rows.filter(r=>String(r[1]||'').toLowerCase().match(/int|double|decimal|float|bigint|real/)).map(r=>r[0]);
      const dimCols=rows.filter(r=>String(r[1]||'').toLowerCase().match(/char|varchar|date|time/)||/(region|segment|product|customer|channel|status|month|quarter|year)/i.test(String(r[0]||''))).map(r=>r[0]);
      const dims=dimCols.length?dimCols.slice(0,2):['region'];
      dims.forEach(dim=>{
        numCols.slice(0,3).forEach(metric=>{
          const alias=`total_${metric}`;
          addUniqueSuggestion(suggestions,`${metric.replace(/_/g,' ')} by ${dim.replace(/_/g,' ')}`,`SELECT ${dim}, SUM(${metric}) AS ${alias} FROM ${fq} GROUP BY ${dim} ORDER BY ${alias} DESC LIMIT 100`);
        });
      });
    }
    return (suggestions.length?suggestions:chartableDemoSuggestions()).slice(0,8);
  }

  // After SELECT *
  if(sqlUp.includes('SELECT *')){
    if(fq){
      const tName=fq.split('.').pop();
      knownTableChartSuggestions(tName,fq).forEach(s=>addUniqueSuggestion(suggestions,s.label,s.sql));
    }
    return (suggestions.length?suggestions:chartableDemoSuggestions()).slice(0,8);
  }

  // After COUNT/SUM/AVG/aggregation
  if(sqlUp.match(/\b(COUNT|SUM|AVG|MIN|MAX)\s*\(/)){
    if(fq){
      const tName=fq.split('.').pop();
      knownTableChartSuggestions(tName,fq).forEach(s=>addUniqueSuggestion(suggestions,s.label,s.sql));
    }
    return (suggestions.length?suggestions:chartableDemoSuggestions()).slice(0,8);
  }

  // After SHOW SCHEMAS
  if(sqlUp.includes('SHOW SCHEMAS')){
    return chartableDemoSuggestions();
  }

  // Default fallback
  return (suggestions.length?suggestions:chartableDemoSuggestions()).slice(0,8);
}

function renderTable(columns,rows,msgId){
  const limit=20;
  const showAll=rows.length<=limit;
  let h=`<div class="data-table-wrap" style="max-height:400px;overflow-y:auto"><table class="data-table"><thead><tr>`;
  columns.forEach(c=>h+=`<th>${esc(c)}</th>`);
  h+=`</tr></thead><tbody id="${msgId}_tbody">`;
  const display=showAll?rows:rows.slice(0,limit);
  display.forEach(r=>{h+=`<tr>`;columns.forEach((c,i)=>h+=renderTableCell(c,r[i]));h+=`</tr>`});
  h+=`</tbody></table></div>`;
  if(!showAll){h+=`<button class="show-more-btn" onclick="showAllRows('${msgId}')">Show all ${rows.length} rows</button>`}
  return h;
}

function renderTableCell(column,value){
  const text=String(value??'');
  if(isLongSQLValue(column,text)){
    return `<td class="long-sql-cell"><pre class="sql-value">${highlightSQL(text)}</pre></td>`;
  }
  return `<td title="${esc(text)}">${esc(text)}</td>`;
}

function isLongSQLValue(column,text){
  const col=String(column||'').toLowerCase();
  const normalized=text.trim().toUpperCase();
  return col.includes('create')||col.includes('ddl')||text.length>160||normalized.startsWith('CREATE TABLE')||normalized.startsWith('SHOW CREATE TABLE');
}

function showAllRows(msgId){
  const msg=state.messages.find(m=>m.id===msgId);
  if(!msg)return;
  const tbody=document.getElementById(msgId+'_tbody');
  if(!tbody)return;
  const{columns,rows}=msg.data;
  let h='';
  rows.forEach(r=>{h+=`<tr>`;columns.forEach((c,i)=>h+=renderTableCell(c,r[i]));h+=`</tr>`});
  tbody.innerHTML=h;
  const btn=tbody.closest('.data-section').querySelector('.show-more-btn');
  if(btn)btn.remove();
}

function exportBtn(label,type,msgId){
  const icons={csv:'&#128196;',xlsx:'&#128202;',html:'&#127760;',pdf:'&#128213;',jpeg:'&#128247;'};
  return `<button class="btn-icon" title="Export ${label}" onclick="doExport('${type}','${msgId}')" style="font-size:.7rem">${icons[type]||''}<span style="font-size:.6rem;margin-left:2px">${label}</span></button>`;
}

// Export
async function doExport(type,msgId){
  const msg=state.messages.find(m=>m.id===msgId);
  if(!msg||!msg.data)return;
  const{columns,rows,sql}=msg.data;
  const title='StarQuery_Export_'+new Date().toISOString().slice(0,10);

  if(type==='csv'||type==='xlsx'||type==='html'){
    try{
      const res=await fetch(`${API}/api/export/${type}`,{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({columns,rows,title})
      });
      if(!res.ok)throw new Error('Export failed');
      const blob=await res.blob();
      const ext={csv:'.csv',xlsx:'.xlsx',html:'.html'}[type];
      downloadBlob(blob,title+ext);
      showToast('Exported '+type.toUpperCase()+' successfully','success');
    }catch(e){showToast('Export failed: '+e.message,'error')}
  }else if(type==='pdf'){
    try{
      const msg=state.messages.find(m=>m.id===msgId);
      if(!msg||!msg.data){showToast('No data to export','error');return}
      const{columns,rows,sql}=msg.data;
      const{jsPDF}=window.jspdf;
      const pdf=new jsPDF('l','mm','a4');
      const PW=pdf.internal.pageSize.getWidth();
      const PH=pdf.internal.pageSize.getHeight();
      const M=14;const CW=PW-M*2;
      let pageNum=1;

      function frame(){
        // ── Top header bar ──
        pdf.setFillColor(26,35,72);pdf.rect(0,0,PW,18,'F');
        pdf.setFillColor(41,98,255);pdf.rect(0,18,PW,1.5,'F');
        pdf.setTextColor(255,255,255);pdf.setFont('helvetica','bold');pdf.setFontSize(12);
        pdf.text('Data Analytics AI',M,12);
        pdf.setFont('helvetica','normal');pdf.setFontSize(8);
        pdf.text(new Date().toLocaleString(),PW-M,12,{align:'right'});
        // ── Footer bar ──
        pdf.setFillColor(248,249,252);pdf.rect(0,PH-12,PW,12,'F');
        pdf.setDrawColor(210,213,220);pdf.setLineWidth(0.3);pdf.line(0,PH-12,PW,PH-12);
        pdf.setTextColor(90,95,115);pdf.setFont('helvetica','normal');pdf.setFontSize(7.5);
        pdf.text('Generated by Data Analytics AI  •  Confidential & Internal Use Only',M,PH-4.5);
        pdf.text('Page '+pageNum,PW-M,PH-4.5,{align:'right'});
      }

      frame();

      // ── Report title & meta ──
      let y=26;
      pdf.setTextColor(25,28,40);pdf.setFont('helvetica','bold');pdf.setFontSize(16);
      pdf.text('Query Export Report',M,y);y+=7;
      pdf.setFont('helvetica','normal');pdf.setFontSize(8.5);pdf.setTextColor(90,95,115);
      pdf.text(rows.length+' rows  •  '+columns.length+' columns  •  Exported: '+new Date().toLocaleString(),M,y);

      // ── SQL pill ──
      if(sql){
        y+=7;
        pdf.setFillColor(237,240,250);pdf.roundedRect(M,y,CW,11,2,2,'F');
        pdf.setTextColor(60,80,160);pdf.setFont('courier','normal');pdf.setFontSize(7.5);
        pdf.text((sql.length>180?sql.slice(0,177)+'...':sql),M+3,y+7);
        y+=16;
      }else{y+=7}

      // ── Divider ──
      pdf.setDrawColor(210,213,220);pdf.setLineWidth(0.3);pdf.line(M,y,PW-M,y);y+=5;

      // ── Table ──
      const colW=CW/columns.length;
      const maxChars=Math.max(8,Math.floor((colW-6)/1.9));
      const RH=8,HH=10;

      function thead(yy){
        pdf.setFillColor(30,40,80);pdf.rect(M,yy,CW,HH,'F');
        pdf.setTextColor(255,255,255);pdf.setFont('helvetica','bold');pdf.setFontSize(8);
        columns.forEach((c,i)=>{
          const lbl=String(c).toUpperCase();
          pdf.text(lbl.length>maxChars?lbl.slice(0,maxChars-1)+'…':lbl,M+i*colW+3,yy+6.5);
        });
      }

      thead(y);y+=HH;

      rows.forEach((row,ri)=>{
        if(y+RH>PH-16){pageNum++;pdf.addPage();frame();y=24;thead(y);y+=HH}
        // Row background (alternating)
        pdf.setFillColor(...(ri%2===1?[245,246,250]:[255,255,255]));
        pdf.rect(M,y,CW,RH,'F');
        // Row bottom border
        pdf.setDrawColor(210,213,220);pdf.setLineWidth(0.2);
        pdf.line(M,y+RH,PW-M,y+RH);
        // Column separators
        columns.forEach((_,ci)=>{if(ci>0)pdf.line(M+ci*colW,y,M+ci*colW,y+RH)});
        // Cell text
        pdf.setTextColor(25,28,40);pdf.setFont('helvetica','normal');pdf.setFontSize(8);
        row.forEach((val,ci)=>{
          const v=val==null?'':String(val);
          pdf.text(v.length>maxChars?v.slice(0,maxChars-1)+'…':v,M+ci*colW+3,y+5.5);
        });
        y+=RH;
      });

      pdf.save(title+'.pdf');
      showToast('PDF exported','success');
    }catch(e){showToast('PDF export failed: '+e.message,'error')}
  }else if(type==='jpeg'){
    try{
      // Capture the full bot message bubble (table + chart + everything)
      const target=document.getElementById(msgId);
      if(!target){showToast('Nothing to export','error');return}
      const canvas=await html2canvas(target,{backgroundColor:'#12121a',scale:2});
      const link=document.createElement('a');
      link.download=title+'.jpg';
      link.href=canvas.toDataURL('image/jpeg',0.95);
      link.click();
      showToast('JPEG exported','success');
    }catch(e){showToast('JPEG export failed','error')}
  }
}

function downloadBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}

// Chart
function renderChart(msgId,columns,rows,type,config={}){
  const canvas=document.getElementById(msgId+'_chart');
  if(!canvas||!rows.length)return;

  // Determine label and value column indices
  const strIdxs=columns.map((_,i)=>i).filter(i=>rows[0]&&typeof rows[0][i]==='string');
  const numIdxs=columns.map((_,i)=>i).filter(i=>rows[0]&&typeof rows[0][i]==='number');
  const selectedLabelIdx=config.xAxis?columns.indexOf(config.xAxis):-1;
  const selectedValueIdx=config.yAxis?columns.indexOf(config.yAxis):-1;
  const labelIdx=selectedLabelIdx>=0?selectedLabelIdx:(strIdxs.length?strIdxs[0]:0);
  // Remove labelIdx from value columns to avoid overlap
  let valIdxs=(selectedValueIdx>=0&&selectedValueIdx!==labelIdx)?[selectedValueIdx]:numIdxs.filter(i=>i!==labelIdx);
  if(!valIdxs.length) valIdxs=numIdxs.length>1?numIdxs.slice(1):[columns.length>1?1:0];
  if(valIdxs.length>1){
    const stats=valIdxs.map(i=>{
      const vals=rows.slice(0,50).map(r=>Math.abs(Number(r[i])||0));
      return {idx:i,max:Math.max(...vals),avg:vals.reduce((a,b)=>a+b,0)/(vals.length||1)};
    }).filter(s=>s.max>0);
    const maxVal=Math.max(...stats.map(s=>s.max));
    const minVal=Math.min(...stats.map(s=>s.max));
    if(stats.length>1&&maxVal/minVal>20){
      const preferred=['revenue','sales','profit','actual','forecast','value','reviews','stock'];
      const picked=stats
        .sort((a,b)=>{
          const ap=preferred.findIndex(p=>columns[a.idx].toLowerCase().includes(p));
          const bp=preferred.findIndex(p=>columns[b.idx].toLowerCase().includes(p));
          const ar=ap<0?99:ap; const br=bp<0?99:bp;
          return ar-br||b.max-a.max;
        })[0];
      valIdxs=[picked.idx];
    }
  }

  const labelColName=columns[labelIdx];
  const labels=rows.slice(0,50).map(r=>String(r[labelIdx]??''));
  const colors=colorThemes[state.colorTheme]||colorThemes.purple;
  const isDark=state.theme==='dark';

  const datasets=valIdxs.map((vi,i)=>{
    const d=rows.slice(0,50).map(r=>Number(r[vi])||0);
    const perBar=type==='pie'||type==='doughnut'||(type==='bar'&&valIdxs.length===1);
    const bg=perBar?d.map((_,j)=>colors[j%colors.length]):colors[i%colors.length];
    const bc=perBar?d.map((_,j)=>colors[j%colors.length].replace('.8','1')):colors[i%colors.length].replace('.8','.9');
    const cfg={label:columns[vi],data:d,backgroundColor:bg,borderColor:bc,borderWidth:2,borderRadius:type==='bar'?6:0};
    if(type==='area'||type==='line'){cfg.fill=type==='area';cfg.tension=0.4;cfg.pointRadius=4;cfg.pointHoverRadius=7;cfg.pointBackgroundColor=colors[i%colors.length];cfg.pointBorderColor=isDark?'#12121a':'#fff';cfg.pointBorderWidth=2}
    return cfg;
  });

  const chartType=type==='area'?'line':type;
  if(state.charts[msgId]){state.charts[msgId].destroy()}

  const isPie=chartType==='pie'||chartType==='doughnut';
  const valColNames=valIdxs.map(i=>columns[i]).join(', ');
  const chartTitle=isPie?`${valColNames} by ${labelColName}`:`${labelColName} vs ${valColNames}`;
  canvas.dataset.chartTitle=chartTitle;
  canvas.dataset.xAxis=labelColName;
  canvas.dataset.yAxis=valColNames;
  canvas.dataset.chartType=chartType;

  state.charts[msgId]=new Chart(canvas,{
    type:chartType,
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:true,
      animation:{duration:1000,easing:'easeOutQuart'},
      plugins:{
        title:{display:true,text:chartTitle,color:isDark?'#e4e4e7':'#27272a',font:{family:'Inter',size:14,weight:'600'},padding:{bottom:16}},
        legend:{position:isPie?'bottom':'top',labels:{color:isDark?'#e4e4e7':'#27272a',font:{family:'Inter',size:12},padding:16,usePointStyle:true,pointStyle:'circle'}},
        tooltip:{
          backgroundColor:'rgba(18,18,26,.95)',titleColor:'#e4e4e7',bodyColor:'#e4e4e7',
          titleFont:{family:'Inter',size:13,weight:'600'},bodyFont:{family:'Inter',size:12},
          borderColor:'rgba(168,85,247,.4)',borderWidth:1,cornerRadius:8,padding:12,
          displayColors:true,boxPadding:6,
          callbacks:{
            label:function(ctx){
              if(isPie){const total=ctx.dataset.data.reduce((a,b)=>a+b,0);const pct=((ctx.raw/total)*100).toFixed(1);return ` ${ctx.label} — ${ctx.raw} (${pct}%)`}
              return ` ${ctx.dataset.label}: ${ctx.raw}`
            }
          }
        }
      },
      scales:isPie?{}:{
        x:{title:{display:true,text:labelColName,color:isDark?'#a1a1aa':'#52525b',font:{family:'Inter',size:11,weight:'500'}},ticks:{color:isDark?'#a1a1aa':'#52525b',font:{family:'Inter',size:11},maxRotation:45},grid:{color:isDark?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)'}},
        y:{title:{display:true,text:valColNames,color:isDark?'#a1a1aa':'#52525b',font:{family:'Inter',size:11,weight:'500'}},ticks:{color:isDark?'#a1a1aa':'#52525b',font:{family:'Inter',size:11}},grid:{color:isDark?'rgba(255,255,255,.05)':'rgba(0,0,0,.08)'},beginAtZero:true}
      }
    }
  });
}

// Chart panel
function updateChartPanel(data){
  if(!data||!data.columns)return;
  const xSel=document.getElementById('xAxisSelect');
  const ySel=document.getElementById('yAxisSelect');
  const msgId=state.selectedMsgId||state.currentMsgId;
  const existing=msgId?state.chartConfigs[msgId]:null;
  const sample=data.rows&&data.rows.length?data.rows[0]:[];
  const strCols=data.columns.filter((_,i)=>sample&&typeof sample[i]==='string');
  const numCols=data.columns.filter((_,i)=>sample&&typeof sample[i]==='number');
  xSel.innerHTML=data.columns.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  ySel.innerHTML=(numCols.length?numCols:data.columns).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const suggestedType=(data.chart_suggestion&&data.chart_suggestion!=='metric'&&data.chart_suggestion!=='table')?data.chart_suggestion:'bar';
  state.chartType=(existing&&existing.chartType)||suggestedType;
  document.querySelectorAll('.chart-type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===state.chartType));
  xSel.value=(existing&&data.columns.includes(existing.xAxis))?existing.xAxis:(strCols[0]||data.columns[0]||'');
  ySel.value=(existing&&data.columns.includes(existing.yAxis))?existing.yAxis:(numCols[0]||data.columns.find(c=>c!==xSel.value)||data.columns[0]||'');
  updateChartConfigFromPanel();
}

function selectChartType(type,btn){
  state.chartType=type;
  document.querySelectorAll('.chart-type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  updateChartConfigFromPanel();
}
function selectColorTheme(theme,el){
  state.colorTheme=theme;
  document.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
}
function generateChartFromPanel(){
  const msgId=getSelectedChartResultId();
  const data=msgId?state.results[msgId]:null;
  if(!msgId||!data)return;
  const config=updateChartConfigFromPanel();
  renderChart(msgId,data.columns,data.rows,state.chartType,config);
  showToast('Chart updated','success');
}

function updateChartConfigFromPanel(){
  const xSel=document.getElementById('xAxisSelect');
  const ySel=document.getElementById('yAxisSelect');
  state.chartConfig={xAxis:xSel?xSel.value:null,yAxis:ySel?ySel.value:null,chartType:state.chartType};
  const msgId=getSelectedChartResultId();
  if(msgId){state.chartConfigs[msgId]={...state.chartConfig}}
  return state.chartConfig;
}

function getSelectedChartResultId(){
  if(state.selectedMsgId&&state.results[state.selectedMsgId])return state.selectedMsgId;
  if(state.currentMsgId&&state.results[state.currentMsgId])return state.currentMsgId;
  const ids=Object.keys(state.results);
  return ids.length?ids[ids.length-1]:null;
}

function selectChartResult(msgId){
  if(!msgId||!state.results[msgId])return;
  state.selectedMsgId=msgId;
  state.currentMsgId=state.currentMsgId||msgId;
  state.currentData=state.currentData||state.results[msgId];
  document.querySelectorAll('.chart-result').forEach(el=>el.classList.toggle('active-result',el.id===msgId));
  updateChartPanel(state.results[msgId]);
}

// SQL highlighting
function highlightSQL(sql){
  const kw=['SELECT','FROM','WHERE','INSERT','INTO','VALUES','UPDATE','SET','DELETE','CREATE','ALTER','DROP','TABLE','INDEX','JOIN','LEFT','RIGHT','INNER','OUTER','FULL','ON','AND','OR','NOT','IN','IS','NULL','AS','ORDER','BY','GROUP','HAVING','LIMIT','OFFSET','UNION','ALL','DISTINCT','COUNT','SUM','AVG','MIN','MAX','CASE','WHEN','THEN','ELSE','END','EXISTS','BETWEEN','LIKE','DESC','ASC','WITH','SHOW','DESCRIBE','SCHEMAS','TABLES','COLUMNS','CATALOG','SCHEMA'];
  let s=esc(sql);
  kw.forEach(k=>{s=s.replace(new RegExp('\\b('+k+')\\b','gi'),`<span class="sql-kw">$1</span>`)});
  s=s.replace(/'([^']*)'/g,`<span class="sql-str">'$1'</span>`);
  s=s.replace(/\b(\d+)\b/g,`<span class="sql-num">$1</span>`);
  return s;
}

// History
function addHistory(text){
  const el=document.getElementById('historyList');
  const div=document.createElement('div');
  div.className='history-item';
  div.textContent=text;
  div.onclick=()=>{document.getElementById('chatInput').value=text;document.getElementById('chatInput').focus()};
  el.prepend(div);
  // Keep max 20
  while(el.children.length>20)el.lastChild.remove();
}

// Toast
function showToast(msg,type='success'){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');
  t.className='toast '+type;
  t.textContent=msg;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(20px)';t.style.transition='all .3s';setTimeout(()=>t.remove(),300)},3000);
}

// Utility
function quoteIdent(name){return `"${String(name).replace(/"/g,'""')}"`}
function jsArg(value){return JSON.stringify(String(value))}
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function scrollChat(){const el=document.getElementById('chatMessages');setTimeout(()=>el.scrollTop=el.scrollHeight,50)}
</script>
